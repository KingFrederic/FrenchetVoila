<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Colors with Frederic — a playful 5-minute lesson that teaches a 5-year-old four French color words: Rouge, Bleu, Jaune and Vert. Instructions in English, colors in French.">
  <meta name="theme-color" content="#7ec8ff">
  <title>Colors with Frederic 🦊 — French Colors for Kids</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦊%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- floating clouds + sun set the friendly outdoor scene -->
  <div class="sky" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
  </div>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <!-- sound on/off, always reachable -->
  <button id="sound-toggle" class="sound-toggle" type="button"
          aria-pressed="true" aria-label="Turn sound off">🔊</button>

  <main class="stage">

    <!-- progress dots: 4 steps -->
    <div class="progress" role="progressbar" aria-label="Lesson progress"
         aria-valuemin="1" aria-valuemax="4">
      <span class="progress-dot" title="Hello"></span>
      <span class="progress-dot" title="The colors"></span>
      <span class="progress-dot" title="The game"></span>
      <span class="progress-dot" title="Great job"></span>
    </div>

    <!-- ===================== STEP 1 · WELCOME ===================== -->
    <section class="screen is-active" data-step="welcome" aria-hidden="false"
             aria-labelledby="welcome-title">
      <div class="welcome-card">
        <div class="guide-hero" aria-hidden="true">🦊</div>
        <h1 id="welcome-title" class="title">
          <span class="title-main">Colors</span>
          <span class="title-sub">Let's learn them in French!</span>
        </h1>
        <p class="lead">Hi! I'm <strong>Frederic</strong>.<br>
          Let's learn <strong>4&nbsp;colors</strong> in French! 🎨</p>
        <button id="start-btn" class="big-btn" type="button">
          <span class="big-btn-emoji">▶️</span> Start!
        </button>
        <p class="subtle">For ages 5 · about 5 minutes</p>
      </div>
    </section>

    <!-- ===================== STEP 2 · FLASH CARDS ===================== -->
    <section class="screen" data-step="cards" aria-hidden="true"
             aria-labelledby="cards-title">
      <h2 id="cards-title" class="step-title">Tap a card to see the color! 🎨</h2>
      <div id="deck" class="deck" role="group" aria-label="Color cards"></div>
      <button id="to-game" class="big-btn next-btn" type="button">
        Let's play! <span class="big-btn-emoji">🎲</span>
      </button>
    </section>

    <!-- ===================== STEP 3 · THE GAME ===================== -->
    <section class="screen" data-step="game" aria-hidden="true"
             aria-labelledby="game-prompt">
      <div id="game-stars" class="stars" aria-label="Stars earned"></div>
      <h2 id="game-prompt" class="step-title game-prompt" aria-live="assertive">
        Find the color!
      </h2>
      <div id="game-board" class="game-board" role="group"
           aria-label="Pick the right color"></div>
    </section>

    <!-- ===================== STEP 4 · CELEBRATION ===================== -->
    <section class="screen" data-step="finish" aria-hidden="true"
             aria-labelledby="finish-title">
      <div class="welcome-card">
        <div class="guide-hero guide-cheer" aria-hidden="true">🦊🏆</div>
        <h2 id="finish-title" class="title">
          <span class="title-main">You did it!</span>
          <span class="title-sub">Great job!</span>
        </h2>
        <p class="score-label">Your score</p>
        <p id="final-score" class="final-score">0 / 4</p>
        <p class="lead">You know <strong>Rouge, Bleu, Jaune</strong> and <strong>Vert</strong>! 🌈</p>
        <div class="finish-btns">
          <button id="again-btn" class="big-btn" type="button">
            <span class="big-btn-emoji">🔁</span> Play again
          </button>
          <button id="replay-btn" class="big-btn ghost-btn" type="button">
            <span class="big-btn-emoji">🏠</span> Home
          </button>
        </div>
      </div>
    </section>

    <!-- Frederic the guide sits at the bottom with a speech bubble -->
    <div class="guide" aria-hidden="true">
      <div id="guide-bubble" class="guide-bubble">Hello! 👋</div>
      <div id="guide-avatar" class="guide-avatar">🦊</div>
    </div>

  </main>

  <!-- data first, then controller -->
  <script src="js/colors.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
